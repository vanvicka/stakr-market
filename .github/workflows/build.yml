name: Build Solana Program

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Solana SBF tools
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.1.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
        env:
          PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libudev-dev protobuf-compiler

      - name: Verify tools
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana --version
          cargo --version
          rustc --version
          cargo build-sbf --version || true

      - name: Build SBF
        run: |
          cd programs/stakr-market
          rm -f ../../Cargo.lock ../../programs/stakr-market/Cargo.lock
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          cargo build-sbf

      - name: Copy artifacts
        run: |
          mkdir -p target/deploy
          if [ -f programs/stakr-market/target/sbpf-solana-solana/release/stakr_market.so ]; then
            cp programs/stakr-market/target/sbpf-solana-solana/release/stakr_market.so target/deploy/
          elif [ -f target/sbpf-solana-solana/release/stakr_market.so ]; then
            cp target/sbpf-solana-solana/release/stakr_market.so target/deploy/
          fi
          ls -la target/deploy/ || true

      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: stakr_market-so
          path: target/deploy/stakr_market.so
