name: Build Solana Program

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: solanafoundation/anchor:v1.0.2
    steps:
      - uses: actions/checkout@v4

      - name: Build (verifiable)
        run: anchor build --verifiable

      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: stakr_market-so
          path: target/verifiable/stakr_market.so

      - name: Upload IDL
        uses: actions/upload-artifact@v4
        with:
          name: stakr_market-idl
          path: target/idl/prediction_market.json
