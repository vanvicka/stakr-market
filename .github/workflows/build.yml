name: Build Solana Program

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with Anchor (verifiable)
        uses: solanafoundation/anchor@v1.0.2
        with:
          args: build --verifiable

      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: stakr_market-so
          path: target/verifiable/stakr_market.so

      - name: Upload IDL
        uses: actions/upload-artifact@v4
        with:
          name: stakr_market-idl
          path: target/idl/prediction_market.json

      - name: Upload deployed .so alias
        uses: actions/upload-artifact@v4
        with:
          name: stakr_market-deploy
          path: target/deploy/stakr_market.so
