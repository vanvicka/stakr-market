name: Build Solana Program

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor
        run: |
          cargo install anchor-cli --version 0.30.1 --locked
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Verify tools
        run: |
          solana --version
          anchor --version
          cargo --version
          rustc --version

      - name: Remove stale lockfile
        run: rm -f Cargo.lock

      - name: Build
        run: anchor build

      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: stakr_market-so
          path: target/deploy/stakr_market.so

      - name: Upload IDL
        uses: actions/upload-artifact@v4
        with:
          name: stakr_market-idl
          path: target/idl/prediction_market.json
